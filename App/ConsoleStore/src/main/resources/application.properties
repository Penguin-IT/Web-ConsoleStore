spring.datasource.url=jdbc:sqlserver://localhost;databaseName=QLStoreConsole;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.connection-timeout=10000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true


spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Tu dong huy don online chua thanh toan qua han
#30
#60000
#60000
store.order-expiry.enabled=true
store.order-expiry.timeout-minutes=15
store.order-expiry.initial-delay-ms=10000
store.order-expiry.scan-delay-ms=10000
store.order-expiry.batch-size=100

# May tra cuu TCP Socket
store.lookup.enabled=true
store.lookup.port=9000
# Chat khach hang - nhan vien (TCP Socket)
store.chat.enabled=true
store.chat.port=9100
store.chat.gui=true
ng.thymeleaf.cache=false