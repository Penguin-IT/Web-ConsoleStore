<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1">

  <title>Duyệt thanh toán | Console Store</title>

  <link rel="stylesheet" th:href="@{/css/home.css}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="stylesheet" th:href="@{/css/pos.css}">

  <script th:src="@{/js/store.js}" defer></script>
</head>

<body>
<header th:replace="~{fragments/store :: header}"></header>

<main id="main-content"
      class="container store-container pos-page">

  <div class="ui-page-heading">
    <h1>Thanh toán chờ duyệt</h1>
  </div>

  <section class="ui-panel">
    <form method="get"
          class="ui-toolbar"
          th:action="@{/payments}">

      <label class="ui-field">
        <span>Tìm kiếm</span>

        <input name="keyword"
               maxlength="100"
               placeholder="Mã thanh toán, mã đơn, khách hàng, điện thoại"
               th:value="${keyword}">
      </label>

      <label class="ui-field">
        <span>Phương thức</span>

        <select name="method">
          <option value="">Tất cả</option>

          <option th:each="item : ${methodLabels}"
                  th:value="${item.key}"
                  th:text="${item.value}"
                  th:selected="${method == item.key}">
          </option>
        </select>
      </label>

      <button class="ui-btn ui-primary" type="submit">
        Tìm kiếm
      </button>

      <a class="ui-btn" th:href="@{/payments}">
        Xóa bộ lọc
      </a>
    </form>

    <div class="ui-table-wrap">
      <table class="ui-table">
        <thead>
        <tr>
          <th>Mã TT</th>
          <th>Đơn hàng</th>
          <th>Khách hàng</th>
          <th>Ngày đặt</th>
          <th>Phương thức</th>
          <th>Số tiền</th>
          <th></th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="payment : ${payments.content}">
          <td th:text="${'TT' + payment.id}"></td>
          <td th:text="${'HD' + payment.invoiceId}"></td>

          <td>
            <strong th:text="${payment.customerName}"></strong>
            <br>
            <span th:text="${payment.phone}"></span>
          </td>

          <td th:text="${#temporals.format(
                        payment.createdAt,
                        'dd/MM/yyyy HH:mm'
                    )}"></td>

          <td th:text="${methodLabels[payment.method]}"></td>

          <td th:text="${#numbers.formatDecimal(
                        payment.amount,
                        1, 'POINT', 0, 'COMMA'
                    ) + ' ₫'}"></td>

          <td>
            <a class="ui-btn"
               th:href="@{/payments/{id}(
                               id=${payment.id}
                           )}">
              Kiểm tra
            </a>
          </td>
        </tr>

        <tr th:if="${payments.empty}">
          <td colspan="7">
            Không có thanh toán chờ duyệt.
          </td>
        </tr>
        </tbody>
      </table>
    </div>

    <div class="ui-pagination">
            <span th:text="${payments.totalElements + ' thanh toán'}">
            </span>

      <div>
        <a class="ui-btn"
           th:if="${payments.hasPrevious()}"
           th:href="@{/payments(
                       page=${payments.number - 1},
                       keyword=${keyword},
                       method=${method}
                   )}">
          ← Trước
        </a>

        <span th:text="${'Trang '
                    + (payments.number + 1)
                    + ' / '
                    + (payments.totalPages == 0
                        ? 1 : payments.totalPages)}">
                </span>

        <a class="ui-btn"
           th:if="${payments.hasNext()}"
           th:href="@{/payments(
                       page=${payments.number + 1},
                       keyword=${keyword},
                       method=${method}
                   )}">
          Sau →
        </a>
      </div>
    </div>
  </section>
</main>

<footer th:replace="~{fragments/store :: footer}"></footer>
</body>
</html>
