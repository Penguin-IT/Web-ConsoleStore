<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Phiếu thu cũ | Console Store</title>

    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/pos.css}">

    <script th:src="@{/js/store.js}" defer></script>
</head>

<body>
<header th:replace="~{fragments/store :: header}"></header>

<main id="main-content"
      class="container store-container pos-page">

    <div class="ui-page-heading">
        <h1 th:text="${'Phiếu thu cũ PTC' + detail.receipt.id}">
        </h1>

        <div class="pos-actions">
            <a class="ui-btn" th:href="@{/trade-ins}">
                Danh sách phiếu
            </a>

            <a class="ui-btn" th:href="@{/trade-ins/new}">
                Lập phiếu mới
            </a>
        </div>
    </div>

    <section class="ui-panel">
        <dl class="ui-details">
            <div>
                <dt>Ngày thu</dt>
                <dd th:text="${#temporals.format(
                    detail.receipt.createdAt,
                    'dd/MM/yyyy HH:mm'
                )}"></dd>
            </div>

            <div>
                <dt>Khách hàng</dt>
                <dd th:text="${detail.customer.fullName}"></dd>
            </div>

            <div>
                <dt>Số điện thoại</dt>
                <dd th:text="${detail.customer.phone}"></dd>
            </div>

            <div>
                <dt>Kho nhận</dt>
                <dd th:text="${detail.warehouse.name}"></dd>
            </div>

            <div th:if="${detail.cashPaid}">
                <dt>Chi trả</dt>
                <dd>Đã chi tiền mặt</dd>
            </div>

            <div>
                <dt>Hóa đơn liên kết</dt>
                <dd th:text="${detail.receipt.invoiceId == null
                    ? '—'
                    : 'HD' + detail.receipt.invoiceId}">
                </dd>
            </div>

            <div>
                <dt>Ghi chú</dt>
                <dd class="pos-note"
                    th:text="${#strings.isEmpty(detail.note)
                        ? '—' : detail.note}">
                </dd>
            </div>
        </dl>

        <div class="ui-table-wrap">
            <table class="ui-table">
                <thead>
                <tr>
                    <th>Thiết bị</th>
                    <th>SL</th>
                    <th>Giá thu</th>
                    <th>Thành tiền</th>
                    <th>Tình trạng</th>
                    <th>Serial / Ghi chú</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="line : ${detail.lines}">
                    <td th:text="${line.name}"></td>
                    <td th:text="${line.quantity}"></td>

                    <td th:text="${#numbers.formatDecimal(
                        line.price, 1, 'POINT', 0, 'COMMA'
                    ) + ' ₫'}"></td>

                    <td th:text="${#numbers.formatDecimal(
                        line.subtotal, 1, 'POINT', 0, 'COMMA'
                    ) + ' ₫'}"></td>

                    <td th:text="${line.condition}"></td>
                    <td th:text="${line.note}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <h2 th:text="${'Tổng chi: '
            + #numbers.formatDecimal(
                detail.receipt.totalAmount,
                1, 'POINT', 0, 'COMMA'
            ) + ' ₫'}">
        </h2>
    </section>
</main>

<footer th:replace="~{fragments/store :: footer}"></footer>
</body>
</html>
