<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Quản lý tài khoản | Console Store</title>

    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/pos.css}">
    <link rel="stylesheet" th:href="@{/css/staff.css}">

    <script th:src="@{/js/store.js}" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" th:href="@{/css/polish.css(v='20261124')}">
    <script th:src="@{/js/polish.js(v='20261124')}" defer></script>
</head>

<body>
<header th:replace="~{fragments/store :: header}"></header>

<main id="main-content"
      class="container store-container pos-page">

    <div class="ui-page-heading">
        <h1 th:text="${accountId == null}
                ? 'Tạo tài khoản nhân viên' : 'Quản lý tài khoản'">
        </h1>

        <a class="ui-btn" th:href="@{/staff/accounts}">
            ← Danh sách tài khoản
        </a>
    </div>

    <section class="ui-panel">
        <p class="ui-alert"
           role="alert"
           th:if="${error}"
           th:text="${error}">
        </p>

        <p th:if="${owner != null}"
           th:text="${owner}">
        </p>

        <form method="post"
              th:action="${accountId == null}
                  ? @{/staff/accounts}
                  : @{/staff/accounts/{id}(id=${accountId})}">

            <input type="hidden"
                   name="employeeId"
                   th:value="${form.employeeId}">

            <input type="hidden"
                   name="version"
                   th:value="${form.version}">

            <div class="staff-form-grid">
                <label class="ui-field staff-full">
                    <span>Tên đăng nhập *</span>

                    <input name="username"
                           required
                           maxlength="100"
                           autocomplete="off"
                           th:readonly="${accountId != null}"
                           th:value="${form.username}">
                </label>

                <label class="ui-field"
                       th:if="${accountId == null}">
                    <span>Mật khẩu *</span>

                    <input type="password"
                           name="password"
                           required
                           minlength="8"
                           autocomplete="new-password">
                </label>

                <label class="ui-field"
                       th:if="${accountId == null}">
                    <span>Xác nhận mật khẩu *</span>

                    <input type="password"
                           name="confirmPassword"
                           required
                           minlength="8"
                           autocomplete="new-password">
                </label>

                <label class="ui-field">
                    <span>Vai trò *</span>

                    <select name="role" required>
                        <option value="NHANVIEN"
                                th:if="${form.employeeId != null}"
                                th:selected="${form.role == 'NHANVIEN'}">
                            Nhân viên
                        </option>

                        <option value="BANHANG"
                                th:if="${form.employeeId != null}"
                                th:selected="${form.role == 'BANHANG'}">
                            Nhân viên bán hàng
                        </option>

                        <option value="KHO"
                                th:if="${form.employeeId != null}"
                                th:selected="${form.role == 'KHO'}">
                            Nhân viên kho
                        </option>

                        <option value="BAOHANH"
                                th:if="${form.employeeId != null}"
                                th:selected="${form.role == 'BAOHANH'}">
                            Nhân viên bảo hành
                        </option>

                        <option value="ADMIN"
                                th:if="${form.role != 'KHACHHANG'}"
                                th:selected="${form.role == 'ADMIN'}">
                            Quản trị
                        </option>

                        <option value="KHACHHANG"
                                th:if="${form.role == 'KHACHHANG'}"
                                selected>
                            Khách hàng
                        </option>
                    </select>
                </label>

                <label class="ui-field"
                       th:if="${accountId != null}">
                    <span>Trạng thái *</span>

                    <select name="locked" required>
                        <option value="false"
                                th:selected="${form.locked == false}">
                            Hoạt động
                        </option>

                        <option value="true"
                                th:selected="${form.locked == true}">
                            Đã khóa
                        </option>
                    </select>
                </label>
            </div>

            <div class="staff-actions">
                <button class="ui-btn ui-primary"
                        type="submit"
                        th:text="${accountId == null}
                            ? 'Tạo tài khoản' : 'Lưu thay đổi'">
                </button>

                <a class="ui-btn" th:href="@{/staff/accounts}">
                    Hủy
                </a>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragments/store :: footer}"></footer>
</body>
</html>
