<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Quản lý sản phẩm | Console Store</title>

    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/pos.css}">
    <link rel="stylesheet" th:href="@{/css/product-management.css}">

    <script th:src="@{/js/store.js}" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" th:href="@{/css/polish.css(v='20261124')}">
    <script th:src="@{/js/polish.js(v='20261124')}" defer></script>
</head>

<body>
    <header th:replace="~{fragments/store :: header}"></header>

    <main id="main-content" class="container store-container pos-page">

        <div class="ui-page-heading">
            <h1>Quản lý sản phẩm</h1>

            <div class="pm-actions">
                <a class="ui-btn" th:href="@{/manage-products/categories}">
                    Loại &amp; nền tảng
                </a>

                <a class="ui-btn ui-primary" th:href="@{/manage-products/new}">
                    ＋ Thêm sản phẩm
                </a>
            </div>
        </div>

        <p class="ui-alert" role="alert" th:if="${error}" th:text="${error}">
        </p>

        <p role="status" th:if="${success}" th:text="${success}">
        </p>

        <section class="ui-panel">
            <form class="pm-filters" method="get" th:action="@{/manage-products}">

                <label class="ui-field">
                    <span>Tên sản phẩm</span>

                    <input name="keyword" maxlength="100" placeholder="Nhập tên sản phẩm" th:value="${keyword}">
                </label>

                <label class="ui-field">
                    <span>Trạng thái</span>

                    <select name="status">
                        <option value="active" th:selected="${status == 'active'}">
                            Đang bán
                        </option>

                        <option value="deleted" th:selected="${status == 'deleted'}">
                            Đã xóa
                        </option>

                        <option value="all" th:selected="${status == 'all'}">
                            Tất cả
                        </option>
                    </select>
                </label>

                <label class="ui-field">
                    <span>Sắp xếp</span>

                    <select name="sort">
                        <option value="newest" th:selected="${sort == 'newest'}">
                            Mã mới nhất
                        </option>

                        <option value="name" th:selected="${sort == 'name'}">
                            Tên A–Z
                        </option>

                        <option value="price-asc" th:selected="${sort == 'price-asc'}">
                            Giá tăng dần
                        </option>

                        <option value="price-desc" th:selected="${sort == 'price-desc'}">
                            Giá giảm dần
                        </option>
                    </select>
                </label>

                <button class="ui-btn ui-primary" type="submit">
                    Tìm kiếm
                </button>

                <a class="ui-btn" th:href="@{/manage-products}">
                    Đặt lại
                </a>
            </form>

            <p>
                <strong th:text="${products.totalElements}">0</strong>
                sản phẩm
            </p>

            <div class="ui-table-wrap">
                <table class="ui-table">
                    <thead>
                        <tr>
                            <th>Ảnh</th>
                            <th>Sản phẩm</th>
                            <th>Loại</th>
                            <th>Nền tảng</th>
                            <th>Tình trạng</th>
                            <th>Giá bán</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="product : ${products.content}">
                            <td>
                                <img class="pm-thumbnail" th:src="@{${product.image}}" th:alt="${product.name}"
                                    loading="lazy" onerror="this.onerror=null;this.src=this.dataset.fallback"
                                    th:attr="data-fallback=@{/images/ui/product-placeholder.svg}">
                            </td>

                            <td>
                                <strong th:text="${product.name}"></strong>

                                <div class="pm-muted" th:text="|SP${product.id}|">
                                </div>
                            </td>

                            <td th:text="${product.category}"></td>
                            <td th:text="${product.platform}"></td>
                            <td th:text="${product.condition}"></td>

                            <td class="pm-price" th:text="|${#numbers.formatDecimal(
                            product.price, 0, 'POINT', 0, 'COMMA'
                        )} đ|">
                            </td>

                            <td th:text="${product.deleted
                            ? 'Đã xóa' : 'Đang bán'}">
                            </td>

                            <td>
                                <div class="pm-actions" th:unless="${product.deleted}">

                                    <a class="ui-btn" th:href="@{/manage-products/{id}/edit(
                                    id=${product.id}
                               )}">
                                        Sửa
                                    </a>

                                    <form method="post" th:action="@{/manage-products/{id}/delete(
                                      id=${product.id}
                                  )}" th:attr="data-product-name=${product.name}" onsubmit="return confirm(
                                      'Xóa sản phẩm ' +
                                      this.dataset.productName + '?'
                                  )">

                                        <input type="hidden" name="version" th:value="${product.version}">

                                        <button class="ui-btn pm-danger" type="submit">
                                            Xóa
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>

                        <tr th:if="${products.empty}">
                            <td colspan="8" class="pm-empty">
                                Không tìm thấy sản phẩm.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <nav class="pm-pagination" aria-label="Phân trang sản phẩm">

                <a class="ui-btn" th:if="${products.hasPrevious()}" th:href="@{/manage-products(
                   keyword=${keyword},
                   status=${status},
                   sort=${sort},
                   page=${products.number - 1}
               )}">
                    ← Trước
                </a>

                <span th:text="|Trang ${products.number + 1}
                / ${products.totalPages == 0 ? 1 : products.totalPages}|">
                </span>

                <a class="ui-btn" th:if="${products.hasNext()}" th:href="@{/manage-products(
                   keyword=${keyword},
                   status=${status},
                   sort=${sort},
                   page=${products.number + 1}
               )}">
                    Sau →
                </a>
            </nav>
        </section>
    </main>

    <footer th:replace="~{fragments/store :: footer}"></footer>
</body>

</html>
