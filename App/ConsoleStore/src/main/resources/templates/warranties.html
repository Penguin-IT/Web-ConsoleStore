<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Bảo hành | Console Store</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/pos.css}">
    <link rel="stylesheet" th:href="@{/css/warranty-validation.css}">
    <script th:src="@{/js/store.js}" defer></script>
    <script th:src="@{/js/warranty-validation.js}" defer></script>
</head>
<body>
<header th:replace="~{fragments/store :: header}"></header>

<main id="main-content" class="container store-container pos-page">
    <div class="ui-page-heading">
        <h1>Bảo hành</h1>
        <a class="ui-btn ui-primary" th:href="@{/warranties/new}">＋ Tiếp nhận máy</a>
    </div>

    <p class="ui-alert validation-summary" role="alert"
       th:if="${error != null}" th:text="${error}"></p>

    <section class="ui-panel">
        <form class="ui-toolbar validation-form" method="get" th:action="@{/warranties}">
            <label class="ui-field">
                <span>Tìm kiếm</span>
                <input name="keyword" type="search" maxlength="100"
                       placeholder="Mã phiếu, serial, sản phẩm"
                       th:value="${keyword}" aria-label="Từ khóa tìm kiếm">
                <small class="field-hint">Tối đa 100 ký tự.</small>
            </label>

            <label class="ui-field">
                <span>Trạng thái</span>
                <select name="status">
                    <option value="">Tất cả</option>
                    <option th:each="item : ${statusLabels}"
                            th:value="${item.key}"
                            th:selected="${status == item.key}"
                            th:text="${item.value}"></option>
                </select>
            </label>

            <button class="ui-btn ui-primary" type="submit">Tìm kiếm</button>
            <a class="ui-btn" th:href="@{/warranties}">Xóa bộ lọc</a>
        </form>

        <div class="ui-table-wrap">
            <table class="ui-table">
                <thead>
                <tr>
                    <th>Mã phiếu</th><th>Thiết bị / Serial</th>
                    <th>Tiếp nhận</th><th>Hẹn trả</th>
                    <th>Bảo hành lúc nhận</th><th>Trạng thái</th><th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${cases.content}">
                    <td th:text="${'BH' + item.id}"></td>
                    <td><strong th:text="${item.productName}"></strong><br>
                        <span th:text="${item.number}"></span></td>
                    <td th:text="${item.receivedAt == null ? '—' : #temporals.format(item.receivedAt, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${item.dueAt == null ? '—' : #temporals.format(item.dueAt, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${item.covered ? 'Còn hạn' : 'Ngoài hạn'}"></td>
                    <td th:text="${statusLabels[item.status]}"></td>
                    <td><a class="ui-btn" th:href="@{/warranties/{id}(id=${item.id})}">Chi tiết</a></td>
                </tr>
                <tr th:if="${cases.empty}">
                    <td colspan="7">Không tìm thấy phiếu bảo hành.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="ui-pagination">
            <span th:text="${cases.totalElements + ' phiếu'}"></span>
            <div>
                <a class="ui-btn" th:if="${cases.hasPrevious()}"
                   th:href="@{/warranties(page=${cases.number - 1}, keyword=${keyword}, status=${status})}">← Trước</a>
                <span th:text="${'Trang ' + (cases.number + 1) + ' / ' + (cases.totalPages == 0 ? 1 : cases.totalPages)}"></span>
                <a class="ui-btn" th:if="${cases.hasNext()}"
                   th:href="@{/warranties(page=${cases.number + 1}, keyword=${keyword}, status=${status})}">Sau →</a>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/store :: footer}"></footer>
</body>
</html>
