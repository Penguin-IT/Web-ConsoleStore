<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Hóa đơn | Console Store</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/pos.css}">
    <script th:src="@{/js/store.js}" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
    <script th:src="@{/js/page-transition.js(v='20261127')}"></script>
    <link rel="stylesheet" th:href="@{/css/polish.css(v='20261127')}">
    <script th:src="@{/js/polish.js(v='20261124')}" defer></script>
    <script th:src="@{/js/store-fx.js(v='20261127')}" defer></script>

</head>
<body>
<header th:replace="~{fragments/store :: header}"></header>

<main id="main-content" class="container store-container pos-page">

    <!-- Tiêu đề -->
    <div class="ui-page-heading">
        <h1>Hóa đơn</h1>
    </div>

    <!-- Bộ lọc -->
    <div class="card mb-3 shadow-sm">
        <div class="card-body">
            <form method="get" th:action="@{/invoices}">
                <div class="row g-2 align-items-end">
                    <div class="col-12 col-sm-6 col-lg-3">
                        <label class="form-label fw-semibold">Tìm kiếm</label>
                        <input class="form-control form-control-sm" name="keyword" maxlength="100"
                               placeholder="Mã hóa đơn, khách, điện thoại"
                               th:value="${keyword}">
                    </div>
                    <div class="col-6 col-sm-4 col-lg-2">
                        <label class="form-label fw-semibold">Kênh bán</label>
                        <select class="form-select form-select-sm" name="channel">
                            <option value="">Tất cả</option>
                            <option value="QUAY"   th:selected="${channel == 'QUAY'}">Tại quầy</option>
                            <option value="ONLINE" th:selected="${channel == 'ONLINE'}">Online</option>
                        </select>
                    </div>
                    <div class="col-6 col-sm-4 col-lg-2">
                        <label class="form-label fw-semibold">Trạng thái</label>
                        <select class="form-select form-select-sm" name="status">
                            <option value="">Tất cả</option>
                            <option value="CHO_XAC_NHAN" th:selected="${status == 'CHO_XAC_NHAN'}">Chờ xác nhận</option>
                            <option value="DA_XAC_NHAN"  th:selected="${status == 'DA_XAC_NHAN'}">Đã xác nhận</option>
                            <option value="DANG_GIAO"    th:selected="${status == 'DANG_GIAO'}">Đang giao</option>
                            <option value="HOAN_TAT"     th:selected="${status == 'HOAN_TAT'}">Hoàn tất</option>
                            <option value="HUY"          th:selected="${status == 'HUY'}">Đã hủy</option>
                        </select>
                    </div>
                    <div class="col-6 col-sm-4 col-lg-2">
                        <label class="form-label fw-semibold">Từ ngày lập</label>
                        <input class="form-control form-control-sm" type="date" name="from"
                               min="1753-01-01" max="9998-12-31" th:value="${from}">
                    </div>
                    <div class="col-6 col-sm-4 col-lg-2">
                        <label class="form-label fw-semibold">Đến ngày lập</label>
                        <input class="form-control form-control-sm" type="date" name="to"
                               min="1753-01-01" max="9998-12-31" th:value="${to}">
                    </div>
                    <div class="col-6 col-sm-4 col-lg-2">
                        <label class="form-label fw-semibold">Sắp xếp</label>
                        <select class="form-select form-select-sm" name="sort">
                            <option value="newest"      th:selected="${sort == 'newest'}">Mới nhất</option>
                            <option value="oldest"      th:selected="${sort == 'oldest'}">Cũ nhất</option>
                            <option value="amount-asc"  th:selected="${sort == 'amount-asc'}">Tiền tăng dần</option>
                            <option value="amount-desc" th:selected="${sort == 'amount-desc'}">Tiền giảm dần</option>
                        </select>
                    </div>
                    <div class="col-12 d-flex gap-2 mt-1">
                        <button class="ui-btn ui-primary" type="submit">Tìm kiếm</button>
                        <a class="ui-btn" th:href="@{/invoices}">Đặt lại</a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <p class="ui-alert" role="alert" th:if="${error}" th:text="${error}"></p>

    <!-- Bảng hóa đơn -->
    <div class="card shadow-sm" th:if="${invoices != null}">
        <div class="card-body p-0">
            <div class="d-flex justify-content-between align-items-center px-3 pt-3 pb-2">
                <span class="text-muted small">
                    <strong th:text="${invoices.totalElements}"></strong> hóa đơn
                </span>
            </div>
            <div class="table-responsive">
                <table class="table table-hover table-sm align-middle mb-0 ui-table">
                    <thead class="table-light">
                    <tr>
                        <th>Mã</th>
                        <th>Ngày lập</th>
                        <th>Khách hàng</th>
                        <th>Kênh</th>
                        <th>Trạng thái</th>
                        <th class="text-end">Tổng tiền</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="invoice : ${invoices.content}">
                        <td class="fw-semibold" th:text="|HD${invoice.id}|"></td>
                        <td th:text="${#temporals.format(invoice.createdAt,'dd/MM/yyyy HH:mm')}"></td>
                        <td>
                            <strong th:text="${invoice.customerName}"></strong>
                            <div class="invoice-muted" th:text="${invoice.phone}"></div>
                        </td>
                        <td th:text="${invoice.channelLabel()}"></td>
                        <td><span class="invoice-badge" th:text="${invoice.statusLabel()}"></span></td>
                        <td class="invoice-money"
                            th:text="|${#numbers.formatDecimal(invoice.totalAmount,0,'POINT',0,'COMMA')} đ|"></td>
                        <td>
                            <a class="ui-btn" th:href="@{/invoices/{id}(id=${invoice.id})}">Chi tiết</a>
                        </td>
                    </tr>
                    <tr th:if="${invoices.empty}">
                        <td colspan="7" class="invoice-empty">Không tìm thấy hóa đơn.</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- Phân trang -->
            <nav class="d-flex justify-content-between align-items-center px-3 py-2" aria-label="Phân trang">
                <a class="ui-btn" th:if="${invoices.hasPrevious()}"
                   th:href="@{/invoices(keyword=${keyword},channel=${channel},status=${status},from=${from},to=${to},sort=${sort},page=${invoices.number - 1})}">
                    ← Trước
                </a>
                <span th:unless="${invoices.hasPrevious()}"></span>
                <span class="text-muted small"
                      th:text="|Trang ${invoices.number + 1} / ${invoices.totalPages == 0 ? 1 : invoices.totalPages}|">
                </span>
                <a class="ui-btn" th:if="${invoices.hasNext()}"
                   th:href="@{/invoices(keyword=${keyword},channel=${channel},status=${status},from=${from},to=${to},sort=${sort},page=${invoices.number + 1})}">
                    Sau →
                </a>
                <span th:unless="${invoices.hasNext()}"></span>
            </nav>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/store :: footer}"></footer>
</body>
</html>
