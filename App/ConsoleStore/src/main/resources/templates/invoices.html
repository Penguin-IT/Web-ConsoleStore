<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,initial-scale=1">

    <title>Hóa đơn | Console Store</title>

    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/pos.css}">
    <link rel="stylesheet" th:href="@{/css/invoices.css}">

    <script th:src="@{/js/store.js}" defer></script>
</head>

<body>
<header th:replace="~{fragments/store :: header}"></header>

<main id="main-content"
      class="container store-container pos-page">

    <div class="ui-page-heading">
        <h1>Hóa đơn</h1>
    </div>

    <section class="ui-panel">
        <form class="invoice-filters"
              method="get"
              th:action="@{/invoices}">

            <label class="ui-field">
                <span>Tìm kiếm</span>

                <input name="keyword"
                       maxlength="100"
                       placeholder="Mã hóa đơn, khách, điện thoại"
                       th:value="${keyword}">
            </label>

            <label class="ui-field">
                <span>Kênh bán</span>

                <select name="channel">
                    <option value="">Tất cả</option>

                    <option value="QUAY"
                            th:selected="${channel == 'QUAY'}">
                        Tại quầy
                    </option>

                    <option value="ONLINE"
                            th:selected="${channel == 'ONLINE'}">
                        Online
                    </option>
                </select>
            </label>

            <label class="ui-field">
                <span>Trạng thái</span>

                <select name="status">
                    <option value="">Tất cả</option>

                    <option value="CHO_XAC_NHAN"
                            th:selected="${status == 'CHO_XAC_NHAN'}">
                        Chờ xác nhận
                    </option>

                    <option value="DA_XAC_NHAN"
                            th:selected="${status == 'DA_XAC_NHAN'}">
                        Đã xác nhận
                    </option>

                    <option value="DANG_GIAO"
                            th:selected="${status == 'DANG_GIAO'}">
                        Đang giao
                    </option>

                    <option value="HOAN_TAT"
                            th:selected="${status == 'HOAN_TAT'}">
                        Hoàn tất
                    </option>

                    <option value="HUY"
                            th:selected="${status == 'HUY'}">
                        Đã hủy
                    </option>
                </select>
            </label>

            <label class="ui-field">
                <span>Từ ngày lập</span>

                <input type="date"
                       name="from"
                       min="1753-01-01"
                       max="9998-12-31"
                       th:value="${from}">
            </label>

            <label class="ui-field">
                <span>Đến ngày lập</span>

                <input type="date"
                       name="to"
                       min="1753-01-01"
                       max="9998-12-31"
                       th:value="${to}">
            </label>

            <label class="ui-field">
                <span>Sắp xếp</span>

                <select name="sort">
                    <option value="newest"
                            th:selected="${sort == 'newest'}">
                        Mới nhất
                    </option>

                    <option value="oldest"
                            th:selected="${sort == 'oldest'}">
                        Cũ nhất
                    </option>

                    <option value="amount-asc"
                            th:selected="${sort == 'amount-asc'}">
                        Tổng tiền tăng dần
                    </option>

                    <option value="amount-desc"
                            th:selected="${sort == 'amount-desc'}">
                        Tổng tiền giảm dần
                    </option>
                </select>
            </label>

            <div class="invoice-actions">
                <button class="ui-btn ui-primary" type="submit">
                    Tìm kiếm
                </button>

                <a class="ui-btn" th:href="@{/invoices}">
                    Đặt lại
                </a>
            </div>
        </form>
    </section>

    <p class="ui-alert"
       role="alert"
       th:if="${error}"
       th:text="${error}">
    </p>

    <section class="ui-panel invoice-section"
             th:if="${invoices != null}">

        <p>
            <strong th:text="${invoices.totalElements}"></strong>
            hóa đơn
        </p>

        <div class="ui-table-wrap">
            <table class="ui-table">
                <thead>
                <tr>
                    <th>Mã</th>
                    <th>Ngày lập</th>
                    <th>Khách hàng</th>
                    <th>Kênh</th>
                    <th>Trạng thái</th>
                    <th>Tổng tiền</th>
                    <th>Thao tác</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="invoice : ${invoices.content}">
                    <td th:text="|HD${invoice.id}|"></td>

                    <td th:text="${#temporals.format(
                        invoice.createdAt, 'dd/MM/yyyy HH:mm'
                    )}">
                    </td>

                    <td>
                        <strong th:text="${invoice.customerName}"></strong>

                        <div class="invoice-muted"
                             th:text="${invoice.phone}">
                        </div>
                    </td>

                    <td th:text="${invoice.channelLabel()}"></td>

                    <td>
                        <span class="invoice-badge"
                              th:text="${invoice.statusLabel()}">
                        </span>
                    </td>

                    <td class="invoice-money"
                        th:text="|${#numbers.formatDecimal(
                            invoice.totalAmount,
                            0, 'POINT', 0, 'COMMA'
                        )} đ|">
                    </td>

                    <td>
                        <a class="ui-btn"
                           th:href="@{/invoices/{id}(id=${invoice.id})}">
                            Chi tiết
                        </a>
                    </td>
                </tr>

                <tr th:if="${invoices.empty}">
                    <td colspan="7" class="invoice-empty">
                        Không tìm thấy hóa đơn.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <nav class="invoice-pagination" aria-label="Phân trang">
            <a class="ui-btn"
               th:if="${invoices.hasPrevious()}"
               th:href="@{/invoices(
                   keyword=${keyword},
                   channel=${channel},
                   status=${status},
                   from=${from},
                   to=${to},
                   sort=${sort},
                   page=${invoices.number - 1}
               )}">
                ← Trước
            </a>

            <span th:text="|Trang ${invoices.number + 1}
                / ${invoices.totalPages == 0 ? 1 : invoices.totalPages}|">
            </span>

            <a class="ui-btn"
               th:if="${invoices.hasNext()}"
               th:href="@{/invoices(
                   keyword=${keyword},
                   channel=${channel},
                   status=${status},
                   from=${from},
                   to=${to},
                   sort=${sort},
                   page=${invoices.number + 1}
               )}">
                Sau →
            </a>
        </nav>
    </section>
</main>

<footer th:replace="~{fragments/store :: footer}"></footer>
</body>
</html>
