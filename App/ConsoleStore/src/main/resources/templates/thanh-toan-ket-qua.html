<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Kết quả đặt hàng</title></head>
<body>

<main class="container">
    <h1 th:if="${hoaDon.trangThai == 'DA_XAC_NHAN'}">Thanh toán thành công</h1>
    <h1 th:if="${hoaDon.trangThai == 'CHO_XAC_NHAN'}">Đơn hàng đang chờ thanh toán</h1>
    <h1 th:if="${hoaDon.trangThai == 'HUY'}">Đơn hàng đã bị hủy</h1>
    <p>Mã đơn: <strong th:text="'#' + ${hoaDon.maHD}"></strong>. Trạng thái hiện tại:
        <strong th:text="${hoaDon.trangThai}"></strong></p>
    <ul>
        <li th:each="ct : ${hoaDon.chiTiet}"
            th:text="${ct.sanPham.tenSP} + ' × ' + ${ct.soLuong}"></li>
    </ul>
    <p>Tổng tiền: <strong th:text="${#numbers.formatDecimal(hoaDon.tongTien, 1, 'POINT', 0, 'COMMA')} + ' ₫'"></strong></p>
    <a class="btn" th:href="@{/don-hang}">Xem đơn hàng của tôi</a> <!-- đường dẫn của Vĩ (CN07) -->
    <a class="btn" th:href="@{/}">Về trang chủ</a>
</main>
</body>
</html>
