<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Thông tin thanh toán | Console Store</title>

    <link rel="icon"
          th:href="@{/images/banners/logo.png}">

    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/checkout.css}">

    <script th:src="@{/js/store.js}" defer></script>
</head>

<body class="customer-page">
<header th:replace="~{fragments/store :: header}"></header>

<main id="main-content"
      class="container store-container checkout-page">

    <div class="checkout-heading">
        <div>
            <p class="eyebrow">YOUR NEXT WORLD IS WAITING</p>

            <h1 th:text="${'Đơn hàng HD' + page.invoice.id}"></h1>

            <p>Đơn hàng đã được ghi nhận.</p>
        </div>

        <a th:href="@{/products}">Tiếp tục mua sắm ↗</a>
    </div>

    <div class="checkout-layout">
        <section class="checkout-panel checkout-payment">
            <h2 th:text="${page.methodLabel}"></h2>

            <div class="checkout-alert"
                 th:if="${page.invoice.status == 'HUY'}">
                Đơn hàng đã hủy. Không thực hiện thanh toán cho đơn này.
            </div>

            <th:block th:if="${page.invoice.status != 'HUY'}">
                <th:block th:if="${
                    page.payment.status == 'CHUA_THANH_TOAN'
                }">
                    <span class="checkout-status">
                        Chờ xác nhận thanh toán
                    </span>

                    <img class="checkout-qr"
                         th:src="@{/images/ui/qr-demo.svg}"
                         width="240"
                         height="240"
                         alt="QR minh họa, không dùng để chuyển tiền thật">



                    <dl class="checkout-payment-info">
                        <dt>Số tiền</dt>

                        <dd th:text="${
                            #numbers.formatDecimal(
                                page.payment.amount,
                                1, 'POINT', 0, 'COMMA'
                            ) + ' ₫'
                        }"></dd>

                        <dt>Nội dung tham chiếu</dt>

                        <dd th:text="${'HD' + page.invoice.id}"></dd>
                    </dl>
                </th:block>

                <div class="checkout-alert checkout-success"
                     th:if="${
                         page.payment.status == 'DA_THANH_TOAN'
                     }">
                    Thanh toán đã được xác nhận.
                </div>
            </th:block>

            <a class="button-primary"
               th:href="@{
                   /checkout/orders/{id}/payment(
                       id=${page.invoice.id}
                   )
               }">
                Tải lại trạng thái
            </a>
        </section>

        <aside class="checkout-panel">
            <h2>Thông tin đơn hàng</h2>

            <div class="checkout-recipient">
                <strong th:text="${page.invoice.recipientName}"></strong>
                <p th:text="${page.invoice.recipientPhone}"></p>
                <p th:text="${page.invoice.address}"></p>

                <p th:if="${!#strings.isEmpty(page.invoice.note)}"
                   th:text="${page.invoice.note}"></p>
            </div>

            <div class="checkout-item checkout-item--text"
                 th:each="line : ${page.lines}">
                <div>
                    <strong th:text="${line.name}"></strong>
                    <p th:text="${'Số lượng: ' + line.quantity}"></p>
                </div>

                <strong th:text="${
                    #numbers.formatDecimal(
                        line.subtotal, 1, 'POINT', 0, 'COMMA'
                    ) + ' ₫'
                }"></strong>
            </div>

            <div class="checkout-total">
                <span>Tổng cộng</span>

                <strong th:text="${
                    #numbers.formatDecimal(
                        page.invoice.totalAmount,
                        1, 'POINT', 0, 'COMMA'
                    ) + ' ₫'
                }"></strong>
            </div>
        </aside>
    </div>
</main>

<footer th:replace="~{fragments/store :: footer}"></footer>
</body>
</html>
