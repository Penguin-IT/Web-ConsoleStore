<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width,initial-scale=1">

    <title>Nhà cung cấp | Console Store</title>

    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/pos.css}">

    <script th:src="@{/js/store.js}" defer></script>
</head>

<body>
<header th:replace="~{fragments/store :: header}"></header>

<main id="main-content"
      class="container store-container pos-page">

    <div class="ui-page-heading">
        <h1>Nhà cung cấp</h1>

        <a class="ui-btn ui-primary"
           th:href="@{/suppliers/new}">
            ＋ Thêm nhà cung cấp
        </a>
    </div>

    <p class="ui-alert"
       role="alert"
       th:if="${error}"
       th:text="${error}">
    </p>

    <p role="status"
       th:if="${success}"
       th:text="${success}">
    </p>

    <section class="ui-panel">
        <form class="ui-toolbar"
              method="get"
              th:action="@{/suppliers}">

            <label class="ui-field">
                <span>Tìm kiếm</span>

                <input name="keyword"
                       maxlength="100"
                       placeholder="Mã, tên, điện thoại, email"
                       th:value="${keyword}">
            </label>

            <button class="ui-btn ui-primary" type="submit">
                Tìm kiếm
            </button>

            <a class="ui-btn" th:href="@{/suppliers}">
                Xóa bộ lọc
            </a>
        </form>

        <div class="ui-table-wrap">
            <table class="ui-table">
                <thead>
                <tr>
                    <th>Mã NCC</th>
                    <th>Tên nhà cung cấp</th>
                    <th>Điện thoại</th>
                    <th>Email</th>
                    <th>Địa chỉ</th>
                    <th>Ngày tạo</th>
                    <th>Thao tác</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="supplier : ${suppliers.content}">
                    <td th:text="${'NCC' + supplier.id}"></td>

                    <td>
                        <strong th:text="${supplier.name}"></strong>
                    </td>

                    <td th:text="${#strings.isEmpty(supplier.phone)
                        ? '—' : supplier.phone}">
                    </td>

                    <td th:text="${#strings.isEmpty(supplier.email)
                        ? '—' : supplier.email}">
                    </td>

                    <td th:text="${#strings.isEmpty(supplier.address)
                        ? '—' : supplier.address}">
                    </td>

                    <td th:text="${#temporals.format(
                        supplier.createdAt,
                        'dd/MM/yyyy HH:mm'
                    )}"></td>

                    <td>
                        <div class="ui-inline-actions">
                            <a class="ui-btn"
                               th:href="@{/suppliers/{id}/edit(
                                   id=${supplier.id}
                               )}">
                                Sửa
                            </a>

                            <form method="post"
                                  th:action="@{/suppliers/{id}/delete(
                                      id=${supplier.id}
                                  )}"
                                  onsubmit="return confirm('Xóa nhà cung cấp này?')">

                                <input type="hidden"
                                       name="version"
                                       th:value="${supplier.version}">

                                <button class="ui-btn" type="submit">
                                    Xóa
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>

                <tr th:if="${suppliers.empty}">
                    <td colspan="7">
                        Không tìm thấy nhà cung cấp.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="ui-pagination">
            <span th:text="${suppliers.totalElements + ' nhà cung cấp'}">
            </span>

            <div>
                <a class="ui-btn"
                   th:if="${suppliers.hasPrevious()}"
                   th:href="@{/suppliers(
                       page=${suppliers.number - 1},
                       keyword=${keyword}
                   )}">
                    ← Trước
                </a>

                <span th:text="${'Trang '
                    + (suppliers.number + 1)
                    + ' / '
                    + (suppliers.totalPages == 0
                        ? 1 : suppliers.totalPages)}">
                </span>

                <a class="ui-btn"
                   th:if="${suppliers.hasNext()}"
                   th:href="@{/suppliers(
                       page=${suppliers.number + 1},
                       keyword=${keyword}
                   )}">
                    Sau →
                </a>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/store :: footer}"></footer>
</body>
</html>
